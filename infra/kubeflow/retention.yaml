apiVersion: batch/v1
kind: CronJob
metadata:
  name: gods-mlops-retention
  namespace: gods-mlops
  labels:
    app.kubernetes.io/name: gods-mlops-retention
spec:
  schedule: "17 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # Resume after a JWT API token has been generated and stored in the Secret.
  suspend: true
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: gods-mlops-retention
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gods-mlops-retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: ubuntu
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: retention
              image: gods-mlops-ingestion:0.2.0
              imagePullPolicy: Never
              command:
                - python
                - -m
                - gods_mlops.retention.runner
              env:
                - name: GODS_MLOPS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: gods-mlops-ingestion-credentials
                      key: DATABASE_URL
                - name: GODS_MLOPS_S3_ENDPOINT_URL
                  valueFrom:
                    configMapKeyRef:
                      name: gods-mlops-ingestion-config
                      key: GODS_MLOPS_S3_ENDPOINT_URL
                - name: GODS_MLOPS_S3_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: gods-mlops-ingestion-config
                      key: GODS_MLOPS_S3_BUCKET
                - name: GODS_MLOPS_S3_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: gods-mlops-ingestion-config
                      key: GODS_MLOPS_S3_REGION
                - name: GODS_MLOPS_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gods-mlops-storage-s3-secret
                      key: admin_access_key_id
                - name: GODS_MLOPS_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: gods-mlops-storage-s3-secret
                      key: admin_secret_access_key
                - name: GODS_MLOPS_LABEL_STUDIO_URL
                  value: http://gods-mlops-label-studio:8080
                - name: GODS_MLOPS_LABEL_STUDIO_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gods-label-studio-credentials
                      key: LABEL_STUDIO_API_TOKEN
                - name: GODS_MLOPS_LABEL_MEDIA_CLEANUP_URL
                  value: http://gods-mlops-label-studio:8090
                - name: GODS_MLOPS_LABEL_MEDIA_CLEANUP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gods-label-studio-credentials
                      key: MEDIA_CLEANUP_TOKEN
              resources:
                requests:
                  cpu: 100m
                  memory: 192Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
