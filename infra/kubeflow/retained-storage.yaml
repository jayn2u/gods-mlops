apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gods-mlops-local-retain
  labels:
    gods.io/managed-storage: "true"
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: false
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gods-mlops-objects
  labels:
    gods.io/managed-storage: "true"
    gods.io/recovery-kind: object-store
    gods.io/pv: gods-mlops-objects
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gods-mlops-local-retain
  volumeMode: Filesystem
  claimRef:
    namespace: gods-mlops
    name: gods-mlops-objects
  local:
    path: /data/jayn2u/gods-mlops/objects
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [ubuntu]
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gods-mlops-cache
  labels:
    gods.io/managed-storage: "true"
    gods.io/recovery-kind: cache
    gods.io/pv: gods-mlops-cache
spec:
  capacity:
    storage: 200Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gods-mlops-local-retain
  volumeMode: Filesystem
  claimRef:
    namespace: gods-mlops
    name: gods-mlops-cache
  local:
    path: /data/jayn2u/gods-mlops/cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [ubuntu]
---
