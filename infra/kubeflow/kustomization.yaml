apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/kubeflow/community-distribution/example?ref=f09f3eeaa25cc852665f460497a42b7fc68639ac
  - gpu-placement-policy.yaml
  - retained-storage.yaml

patches:
  - target:
      group: kubeflow.org
      version: v1beta1
      kind: Profile
      name: kubeflow-user-example-com
    patch: |-
      - op: replace
        path: /metadata/name
        value: gods-mlops
      - op: replace
        path: /spec/owner/name
        value: user@example.com
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: metadata-postgres
      namespace: kubeflow-user-example-com
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: gods-mlops
      - op: add
        path: /metadata/labels
        value: {}
      - op: add
        path: /metadata/labels/gods.io~1managed-storage
        value: "true"
      - op: add
        path: /metadata/labels/gods.io~1recovery-kind
        value: database
      - op: add
        path: /spec/storageClassName
        value: gods-mlops-local-retain
      - op: add
        path: /spec/volumeName
        value: gods-mlops-kfp-metadata-postgres
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: katib-mysql
      namespace: kubeflow
    patch: |-
      - op: add
        path: /metadata/labels
        value: {}
      - op: add
        path: /metadata/labels/gods.io~1managed-storage
        value: "true"
      - op: add
        path: /metadata/labels/gods.io~1recovery-kind
        value: database
      - op: add
        path: /spec/storageClassName
        value: gods-mlops-local-retain
      - op: add
        path: /spec/volumeName
        value: gods-mlops-katib-mysql
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: model-catalog-postgres
      namespace: kubeflow
    patch: |-
      - op: add
        path: /metadata/labels
        value: {}
      - op: add
        path: /metadata/labels/gods.io~1managed-storage
        value: "true"
      - op: add
        path: /metadata/labels/gods.io~1recovery-kind
        value: database
      - op: add
        path: /spec/storageClassName
        value: gods-mlops-local-retain
      - op: add
        path: /spec/volumeName
        value: gods-mlops-model-catalog-postgres
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: mysql-pv-claim
      namespace: kubeflow
    patch: |-
      - op: add
        path: /metadata/labels/gods.io~1managed-storage
        value: "true"
      - op: add
        path: /metadata/labels/gods.io~1recovery-kind
        value: database
      - op: add
        path: /spec/storageClassName
        value: gods-mlops-local-retain
      - op: add
        path: /spec/volumeName
        value: gods-mlops-kfp-mysql
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: seaweedfs-pvc
      namespace: kubeflow
    patch: |-
      - op: add
        path: /metadata/labels/gods.io~1managed-storage
        value: "true"
      - op: add
        path: /metadata/labels/gods.io~1recovery-kind
        value: object-store
      - op: add
        path: /spec/storageClassName
        value: gods-mlops-local-retain
      - op: add
        path: /spec/volumeName
        value: gods-mlops-seaweedfs
