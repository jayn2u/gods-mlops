apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: gods-mlops-gpu-placement
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: gods-training-namespace
      expression: "request.namespace == 'gods-mlops'"
    - name: requests-nvidia-gpu
      expression: >-
        object.spec.containers.exists(container,
          has(container.resources) && has(container.resources.requests) &&
          "nvidia.com/gpu" in container.resources.requests
        ) || (
          has(object.spec.initContainers) &&
          object.spec.initContainers.exists(container,
            has(container.resources) && has(container.resources.requests) &&
            "nvidia.com/gpu" in container.resources.requests
          )
        )
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              nodeSelector: has(object.spec.nodeSelector)
                ? object.spec.nodeSelector
                : {"kubernetes.io/hostname": "ubuntu"},
              runtimeClassName: has(object.spec.runtimeClassName)
                ? object.spec.runtimeClassName
                : "nvidia"
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gods-mlops-gpu-placement-binding
spec:
  policyName: gods-mlops-gpu-placement
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gods-mlops
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gods-mlops-gpu-placement-validation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: gods-training-namespace
      expression: "request.namespace == 'gods-mlops'"
    - name: requests-nvidia-gpu
      expression: >-
        object.spec.containers.exists(container,
          has(container.resources) && has(container.resources.requests) &&
          "nvidia.com/gpu" in container.resources.requests
        ) || (
          has(object.spec.initContainers) &&
          object.spec.initContainers.exists(container,
            has(container.resources) && has(container.resources.requests) &&
            "nvidia.com/gpu" in container.resources.requests
          )
        )
  validations:
    - expression: >-
        object.spec.containers.filter(container,
          has(container.resources) && has(container.resources.requests) &&
          "nvidia.com/gpu" in container.resources.requests
        ).size() + (
          has(object.spec.initContainers)
          ? object.spec.initContainers.filter(container,
              has(container.resources) && has(container.resources.requests) &&
              "nvidia.com/gpu" in container.resources.requests
            ).size()
          : 0
        ) == 1
      message: "Gods GPU pods must request exactly one NVIDIA GPU across regular and init containers."
    - expression: >-
        object.spec.containers.filter(container,
          has(container.resources) && has(container.resources.requests) &&
          "nvidia.com/gpu" in container.resources.requests
        ).all(container,
          container.resources.requests["nvidia.com/gpu"] == quantity("1")
        ) && (
          !has(object.spec.initContainers) ||
          object.spec.initContainers.filter(container,
            has(container.resources) && has(container.resources.requests) &&
            "nvidia.com/gpu" in container.resources.requests
          ).all(container,
            container.resources.requests["nvidia.com/gpu"] == quantity("1")
          )
        )
      message: "Each Gods GPU container must request exactly one NVIDIA GPU."
    - expression: >-
        has(object.spec.nodeSelector) &&
        "kubernetes.io/hostname" in object.spec.nodeSelector &&
        object.spec.nodeSelector["kubernetes.io/hostname"] == "ubuntu"
      message: "Gods GPU pods must select the ubuntu A6000 node."
    - expression: >-
        has(object.spec.runtimeClassName) && object.spec.runtimeClassName == "nvidia"
      message: "Gods GPU pods must use the nvidia RuntimeClass."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gods-mlops-gpu-placement-validation-binding
spec:
  policyName: gods-mlops-gpu-placement-validation
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gods-mlops
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
