apiVersion: v1
kind: Service
metadata:
  name: gods-mlops-ingestion
  namespace: gods-mlops
  labels:
    app.kubernetes.io/name: gods-mlops-ingestion
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gods-mlops-ingestion
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gods-mlops-ingestion
  namespace: gods-mlops
  labels:
    app.kubernetes.io/name: gods-mlops-ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gods-mlops-ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gods-mlops-ingestion
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ingestion-api
          image: gods-mlops-ingestion:0.2.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GODS_MLOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gods-mlops-ingestion-credentials
                  key: DATABASE_URL
            - name: GODS_MLOPS_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: gods-mlops-ingestion-config
                  key: GODS_MLOPS_S3_ENDPOINT_URL
            - name: GODS_MLOPS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: gods-mlops-ingestion-config
                  key: GODS_MLOPS_S3_BUCKET
            - name: GODS_MLOPS_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: gods-mlops-ingestion-config
                  key: GODS_MLOPS_S3_REGION
            - name: GODS_MLOPS_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gods-mlops-storage-s3-secret
                  key: admin_access_key_id
            - name: GODS_MLOPS_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gods-mlops-storage-s3-secret
                  key: admin_secret_access_key
            - name: GODS_MLOPS_INGESTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gods-mlops-ingestion-credentials
                  key: INGESTION_TOKEN
            - name: GODS_MLOPS_BIND_HOST
              value: 0.0.0.0
            - name: GODS_MLOPS_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
